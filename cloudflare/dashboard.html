<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpack 网格巡检</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e14; color: #d7dde8; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b94a7; font-size: 12px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #131824; border: 1px solid #1f2737; border-radius: 10px; padding: 12px 14px; }
  .card .k { color: #8b94a7; font-size: 11px; letter-spacing: .05em; }
  .card .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .pos { color: #4ade80; } .neg { color: #f87171; }
  .section { background: #131824; border: 1px solid #1f2737; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .section h2 { font-size: 13px; margin: 0 0 10px; color: #aab3c5; }
  .gridcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .gcard { background: #0f1522; border: 1px solid #1f2737; border-radius: 8px; padding: 10px 12px; }
  .ghead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .grid-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; }
  .grid-header .gdir { grid-column: 1 / -1; }
  .grid-header .gstatus { margin: 0; white-space: nowrap; justify-self: end; }
  .gmkt { font-weight: 600; font-size: 14px; }
  .gdir { color: #8b94a7; font-size: 12px; }
  .grow { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 2px 0; }
  .grow .k { color: #8b94a7; }
  .health { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0 1px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.g { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
  .dot.y { background: #facc15; box-shadow: 0 0 6px #facc1566; }
  .dot.o { background: #fb923c; box-shadow: 0 0 6px #fb923c99; }
  @media (max-width: 640px) {
    .wrap { padding: 10px 8px 24px; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .cards > .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .card { padding: 10px; }
    .card .v { font-size: 17px; }
    .section { padding: 10px; }
    .gridcards { grid-template-columns: 1fr; gap: 8px; }
    .gcard { padding: 8px 10px; }
  }
  .bar { background: #1f2737; border-radius: 99px; height: 10px; overflow: hidden; margin: 8px 0 4px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #3b82f6, #4ade80); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; margin-right: 6px; border: 1px solid #1f2737; color: #8b94a7; }
  .chip.bad { border-color: #7f1d1d; color: #f87171; background: #2a1215; }
  .chip.ok { border-color: #14532d; color: #4ade80; background: #0f1f16; }
  .muted { color: #8b94a7; }
  .curve-svg { width: 100%; height: 120px; }
  .toolbar svg { width: 15px; height: 15px; flex-shrink: 0; }
  .err { color: #f87171; padding: 40px; text-align: center; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar a, .toolbar button {
    display: inline-flex; align-items: center; gap: 6px;
    background: #131824; color: #d7dde8; border: 1px solid #1f2737; border-radius: 99px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  .toolbar a:hover, .toolbar button:hover { border-color: #3b82f6; background: #182031; }
  .toolbar button:disabled {
    opacity: 1; cursor: default; pointer-events: none;
    background: #16a34a; border-color: #4ade80; color: #ffffff; font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Backpack 网格巡检</h1>
  <div class="sub">每 15 分钟自动更新 · <span id="runStats">-</span> · 数据快照 <span id="ago">-</span></div>
  <div class="toolbar">
    <button id="likeBtn">👍 点赞 <span id="likeCount">-</span></button>
    <a href="https://github.com/terryso/backpack-grid" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
      GitHub 仓库
    </a>
    <a href="https://backpack.exchange/join/suchuanyi" target="_blank" rel="noopener" title="推荐链接（Referral）"><img src="/backpack-icon.png" alt="" style="width:14px;height:14px;vertical-align:-2px;margin-right:3px">注册 Backpack</a>
  </div>
  <div id="content" class="err">加载中…</div>
  <div class="sub" style="margin-top:24px">数据仅供参考，不构成投资建议 · 页内 <a href="https://backpack.exchange/join/suchuanyi" target="_blank" rel="noopener" class="muted">注册 Backpack</a> 为推荐链接</div>
</div>
<script>
const fmt = (n, d = 2) => n == null || !Number.isFinite(Number(n)) ? "未知" : Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pnlCls = (v) => v == null ? "muted" : v >= 0 ? "pos" : "neg";
// 活动档期与历史：静态 JSON（cloudflare/assets/campaign-history.json，构建时拷贝）。
// 新活动只需改该文件：current.tiers/endsAt 换新档，旧活动连同战果写进 past。
let HIST = { current: { name: "Mystery Box 活动 · 第 1 期", endsAt: "2026-10-06T23:59:59Z", tiers: [50000, 300000, 600000, 1100000, 1600000, 2100000, 2600000, 3100000, 3600000, 4100000] }, past: [] };
fetch("/campaign-history.json").then((r) => r.ok ? r.json() : null).then((h) => { if (h) { HIST = h; if (!document.hidden) load(); } }).catch(() => {});
// 健康徽标：距最近触发条件（止盈/止损/出界）的余量，三档颜色
function healthRow(x, s) {
  // 与决策同口径：资金费调整后的盈亏百分比
  if (x.effPnlPct == null && x.pnlPct == null) return `<div class="health">盈亏未知</div>`;
  const pnl = x.effPnlPct != null ? Number(x.effPnlPct) : (Number(x.pnlPct) || 0);
  const tp = s.tpPct ?? 10, sl = s.slPct ?? 6;
  const dists = [
    { name: "止盈", left: +(tp - pnl).toFixed(2) },
    { name: "止损", left: +(pnl + sl).toFixed(2) },
  ];
  const lo = Number(x.rangeLow), hi = Number(x.rangeHigh), px = Number(x.price);
  if (x.price != null && x.rangeLow != null && x.rangeHigh != null && isFinite(px) && px > 0 && isFinite(lo) && isFinite(hi) && hi > lo) {
    const edge = Math.min(px - lo, hi - px);
    dists.push({ name: "出界", left: +(edge / px * 100).toFixed(2) });
  }
  dists.sort((a, b) => a.left - b.left);
  const nearest = dists[0];
  const [dot, label] = nearest.left <= 1.5 ? ["o", "临近换仓"] : nearest.left <= 4 ? ["y", "接近触发"] : ["g", "健康"];
  return `<div class="health"><span class="dot ${dot}"></span><span>${label}</span>
    <span style="margin-left:auto;color:#8b94a7">距${nearest.name} ${nearest.left}%</span></div>`;
}
function render(s) {
  const escape = (v) => typeof v === "string" ? v.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
    : Array.isArray(v) ? v.map(escape) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, escape(x)])) : v;
  s = escape(s);
  const c = document.getElementById("content");
  c.classList.remove("err"); // the loading/错误样式带 40px padding，渲染后必须移除
  if (!s || !s.updatedAt) { c.textContent = "暂无数据"; return; }
  const ageMin = Math.max(0, (Date.now() - new Date(s.updatedAt).getTime()) / 60000);
  document.getElementById("ago").textContent = `${new Date(s.updatedAt).toLocaleString("zh-CN", { hour12: false })}（${ageMin < 1 ? "刚刚" : Math.round(ageMin) + " 分钟前"}）`;
  if (s.runStats) document.getElementById("runStats").textContent = `策略运行 ${fmt(s.runStats.days, 1)} 天 · 累计巡检记录 ${fmt(s.runStats.records, 0)} 条`;
  const g = s.grids || [];
  const pos = s.positions || [];
  const totalPnl = g.reduce((a, x) => a + (Number(x.pnl) || 0), 0);
  const camp = s.campaignVolume || 0;
  // 档位来自活动历史 JSON 的 current.tiers（缺省回退到第 1 期阶梯）
  const TIERS = (HIST?.current?.tiers || []).map(Number).filter((n) => Number.isFinite(n) && n > 0);
  const boxes = TIERS.filter((t) => camp >= t).length;
  const nextTier = TIERS.find((t) => camp < t) || null;
  const tierPct = nextTier ? Math.min(100, camp / nextTier * 100) : 100;
  const fmtShort = (n) => n >= 1000000 ? (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1000 ? Math.round(n / 1000) + "k" : fmt(n, 0);
  const ladder = TIERS.map((t) => {
    const done = camp >= t, isNext = nextTier === t;
    return `<span class="chip" style="${done ? "border-color:#14532d;color:#4ade80" : isNext ? "border-color:#1d4ed8;color:#93c5fd" : ""}">${fmtShort(t)}${done ? " ✓" : ""}</span>`;
  }).join("");
  const chips = [];
  if(s.identityValid===false)chips.push(`<span class="chip bad">账户身份未确认</span>`);
  if(s.manualPauseValid===false)chips.push(`<span class="chip bad">手动暂停记录异常</span>`);
  if(s.manualPauses?.length)chips.push(`<span class="chip">暂停自动轮换：${s.manualPauses.join('、')}</span>`);
  if(s.marketDataAvailable===false)chips.push(`<span class="chip bad">行情降级，暂停新增网格</span>`);
  if (s.runStats?.since) chips.push(`<span class="chip">新运行日志：自 ${new Date(s.runStats.since).toLocaleDateString("zh-CN")} 完成 ${fmt(s.runStats.rounds, 0)} 轮${s.runStats.failedRounds ? " · 失败 " + fmt(s.runStats.failedRounds, 0) + " 轮" : ""}</span>`);
  if (s.quotaExceeded) chips.push(`<span class="chip bad">动态接口不可用：显示部署时的历史快照</span>`);
  if (s.lastRoundStatus && s.lastRoundStatus !== "ok" && s.lastRoundStatus !== "dryrun") chips.push(`<span class="chip bad">上轮状态: ${s.lastRoundStatus}</span>`);
  if (s.dataValid === false) chips.push(`<span class="chip bad">数据异常</span>`);
  if (s.riskStateValid === false) chips.push(`<span class="chip bad">risk.json 异常（新开仓已锁）</span>`);
  if (ageMin > 20 || !Number.isFinite(ageMin)) chips.push(`<span class="chip bad">快照已过期</span>`);
  if (s.riskWriteValid !== true) chips.push(`<span class="chip bad">风控写入未确认</span>`);
  if (s.pendingCorrupt) chips.push(`<span class="chip bad">pending 账本损坏</span>`);
  const badChips = [s.lastRoundStatus && s.lastRoundStatus !== "ok" && s.lastRoundStatus !== "dryrun",
    s.dataValid !== true, s.riskStateValid !== true, s.pendingCorrupt, s.riskWriteValid !== true, s.identityValid===false, s.manualPauseValid===false, ageMin > 20, !s.lastRoundStatus, s.quotaExceeded, s.marketDataAvailable===false].filter(Boolean).length;
  chips.push(s.riskPaused ? `<span class="chip bad">风控熔断已锁</span>`
    : (s.drawdownPct >= 40 ? `<span class="chip bad">回撤预警 ${fmt(s.drawdownPct, 1)}%</span>`
    : (badChips ? `<span class="chip bad">存在异常（见上）</span>` : `<span class="chip ok">风控正常</span>`)));
  chips.push(s.pendingCorrupt ? `<span class="chip bad">待清理状态未知</span>` : (s.pending || []).length ? `<span class="chip bad">待清理 ${s.pending.length}</span>` : `<span class="chip ok">无待清理</span>`);
  chips.push((s.orphans || []).length ? `<span class="chip bad">孤儿持仓 ${s.orphans.length}</span>` : "");
  chips.push(s.lastAction ? `<span class="chip">最近动作 ${s.lastAction}</span>` : `<span class="chip">近期无动作</span>`);
  if (s.fees) chips.push(`<span class="chip">手续费 ${fmt(s.fees.feeUsd)} USD · maker ${s.fees.makerPct == null ? "未知" : fmt(s.fees.makerPct, 1) + "%"} · ${s.fees.fills} 笔 · ${s.fees.incomplete ? "历史未收齐" : "已追平"}</span>`);
  // equity sparkline
  const curve = s.curve || [];
  let svg = "";
  if (curve.length > 1) {
    const vals = curve.map((c) => c[1]);
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    const W = 900, H = 100, step = W / (curve.length - 1);
    const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(H - 6 - (v - min) / span * (H - 12)).toFixed(1)}`);
    svg = `<svg class="curve-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline fill="none" stroke="#3b82f6" stroke-width="2" points="${pts.join(" ")}"/>
      <text x="4" y="12" fill="#8b94a7" font-size="10">max ${fmt(max)}</text>
      <text x="4" y="${H - 4}" fill="#8b94a7" font-size="10">min ${fmt(min)}</text></svg>`;
  }
  c.innerHTML = `
    ${s.quotaExceeded ? `<div class="section"><span class="chip bad">动态接口不可用：以下是部署时的历史快照，不能视为当前实盘状态</span></div>` : ""}
    <div class="cards">
      <div class="card"><div class="k">总权益</div><div class="v">${fmt(s.equity)}</div></div>
      <div class="card"><div class="k">24h 变化</div><div class="v ${pnlCls(s.change24h)}">${s.change24h != null && s.change24h >= 0 ? "+" : ""}${fmt(s.change24h)}</div><div class="muted" style="font-size:10px">较 24h 前 ${s.change24hPct != null ? (s.change24hPct >= 0 ? "+" : "") + fmt(s.change24hPct) + "%" : "-"}</div></div>
      <div class="card"><div class="k">历史总盈亏 <span class="muted" style="font-size:10px">自 ${s.strategyBaselineAt || "09-30"}</span></div>
        <div class="v ${pnlCls(s.strategyTotalPnl ?? s.equityChange)}">${(s.strategyTotalPnl ?? s.equityChange) != null && (s.strategyTotalPnl ?? s.equityChange) >= 0 ? "+" : ""}${fmt(s.strategyTotalPnl ?? s.equityChange)}</div>
        <div class="muted" style="font-size:10px">${s.strategyTotalPnl == null ? "当前权益 − 初始权益；出入金也会影响此值" : "已扣除净入金，含资金费、利息等收益"}</div></div>
      <div class="card"><div class="k">在跑网格盈亏（${g.length} 格）</div><div class="v ${pnlCls(totalPnl)}">${totalPnl >= 0 ? "+" : ""}${fmt(totalPnl)}</div></div>
      <div class="card"><div class="k">回撤（自峰值）</div><div class="v">${fmt(s.drawdownPct, 1)}%</div><div class="muted" style="font-size:10px">峰值采样 1 分钟 · 曲线 15 分钟</div></div>
      <div class="card"><div class="k">历史最大回撤</div><div class="v">${s.maxDrawdown != null ? fmt(s.maxDrawdown, 1) : "-"}%</div><div class="muted" style="font-size:10px" title="按全部已保存的巡检权益计算；未覆盖两次巡检之间的瞬时下跌">记录以来，从高点回落的最大幅度</div></div>
      <div class="card"><div class="k">止损预算占用</div>
        <div class="v ${s.stopBudget?.overBudget?'neg':''}">${s.stopBudget?.valid?fmt(s.stopBudget.pct,1)+'%':'待核对'}</div>
        <div class="muted" style="font-size:10px">${s.stopBudget?.valid
          ? `已占 ${fmt(s.stopBudget.usedUsd)} / 预算 ${fmt(s.stopBudget.budgetUsd)} USD<br>${s.stopBudget.overBudget?'超出 '+fmt(-s.stopBudget.remainingUsd):'余量 '+fmt(s.stopBudget.remainingUsd)} USD；含 ${fmt(s.stopBudget.bufferUsd,0)} USD 退出缓冲<br>预算为权益的 ${fmt(s.stopBudget.riskBudgetPct,0)}% · 配置估算，非实际回撤`
          : s.stopBudget?.reason||'等待完整账户与止损数据'}</div></div>
      ${s.verifiedWindow ? `<div class="card"><div class="k">核算窗口净收益</div>
        <div class="v ${pnlCls(s.verifiedWindow.netPnl)}">${s.verifiedWindow.netPnl==null?'待核对':(s.verifiedWindow.netPnl>=0?'+':'')+fmt(s.verifiedWindow.netPnl)}</div>
        <div class="muted" style="font-size:10px">自 ${s.verifiedWindow.baselineAt?new Date(s.verifiedWindow.baselineAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'起点待核实'}<br>基线 ${fmt(s.verifiedWindow.baselineEquity)} USD；${s.verifiedWindow.cashflowComplete?'已排除净转入资金':'现金流尚未完整核对'}<br>账户收益，包含浮动盈亏<br>${s.verifiedWindow.asOf?'数据截至 '+new Date(s.verifiedWindow.asOf).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'等待采集'}
        <details style="margin-top:6px"><summary style="cursor:pointer">查看账本拆分</summary><div>资金费 ${fmt(s.verifiedWindow.funding,4)} USD<br>借贷利息 ${fmt(s.verifiedWindow.interest,4)} USD<br>奖励 ${fmt(s.verifiedWindow.reward,4)} USD<br>其他交易与估值 ${fmt(s.verifiedWindow.otherTradingAndValuationPnl,4)} USD<br>${s.verifiedWindow.decompositionComplete?'本窗口拆分已核对':'拆分尚未完整核对'}</div></details></div></div>` : ''}
    </div>
    <div class="section">
      ${(() => {
        const endsAt = HIST?.current?.endsAt ? Date.parse(HIST.current.endsAt) : Infinity;
        const active = isFinite(endsAt) ? Date.now() < endsAt : true;
        const d = isFinite(endsAt) ? new Date(endsAt) : null;
        const deadlineText = d ? `活动截止 ${d.getUTCMonth() + 1}-${String(d.getUTCDate()).padStart(2, "0")} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")} UTC` : "";
        if (active) return `
      <h2>交易量活动 · 累计 ${fmt(camp, 0)} USD · 已锁定 ${boxes} 盲盒</h2>
      <div>${ladder}</div>
      <div class="bar" style="margin-top:6px"><i style="width:${tierPct}%"></i></div>
      <div class="muted">${nextTier
        ? `下一档：第 ${boxes + 1} 盒 @ ${fmt(nextTier, 0)} USD · 进度 ${tierPct.toFixed(1)}% · 还差 ${fmt(nextTier - camp, 0)} USD`
        : TIERS.length ? "已达封顶 🎉" : ""}${deadlineText ? " · " + deadlineText : ""}</div>`;
        return `
      <h2>交易量活动（已结束）· 最终累计 ${fmt(camp, 0)} USD · 获得 ${boxes} 盲盒</h2>
      <div>${ladder}</div>
      <div class="muted">${escape(HIST?.current?.name || "活动")}已结束 · 开盒结果更新在下方活动历史</div>`;
      })()}
    </div>
    ${HIST?.past?.length ? `<div class="section">
      <h2>活动历史</h2>
      ${HIST.past.map((p) => `<div class="card" style="margin-bottom:8px">
        <div style="font-weight:600">${escape(String(p.name || ""))}</div>
        <div class="muted" style="font-size:11px">${escape(String(p.period || ""))}</div>
        <div style="margin-top:4px">${escape(String(p.result || ""))}</div>
        ${p.rewards ? `<div class="muted" style="margin-top:2px">奖励：${escape(String(p.rewards))}</div>` : ""}
      </div>`).join("")}
    </div>` : ""}
    <div class="section">
      <h2>网格（${g.length}）</h2>
      <div class="gridcards">
        ${g.map((x) => `<div class="gcard">
          <div class="ghead grid-header"><span class="gmkt">${x.market}</span>
            <span class="gstatus ${x.status === "Triggered" ? "chip ok" : "chip bad"}">${x.status === "Triggered" ? "运行" : "已停止"}</span>
            <span class="gdir">${x.direction} · ${x.count} 格 · 投入 ${fmt(x.value, 0)}</span></div>
          ${(x.price != null && x.pnlPct != null && s.dataValid) ? healthRow(x, s) : ""}
          <div class="grow"><span class="k">区间</span><span>${x.rangeLow} ~ ${x.rangeHigh}</span></div>
          <div class="grow"><span class="k">盈亏</span><span class="${pnlCls(Number(x.pnl))}">${Number(x.pnl) >= 0 ? "+" : ""}${fmt(x.pnl)} USD（${fmt(x.pnlPct)}%）</span></div>
        </div>`).join("")}
        ${g.length === 0 ? `<div class="muted">空仓（全部轮换出去/主动空仓）</div>` : ""}
      </div>
    </div>
    <div class="section">
      <h2>持仓（${pos.length}）</h2>
      <div class="gridcards">
        ${pos.map((p) => {
          const pnlNum = Number(String(p.pnl).replace(/[$,]/g, ""));
          const liqNum = Number(p.liq);
          const liqDist = isFinite(liqNum) && liqNum > 0 ? Math.abs(p.mark - liqNum) / p.mark * 100 : null;
          return `<div class="gcard">
            <div class="ghead"><span class="gmkt">${p.market}</span><span class="gdir">${p.side === "long" ? "多单" : "空单"} · ${p.size}</span></div>
            <div class="grow"><span class="k">标记价</span><span>${p.mark}</span></div>
            <div class="grow"><span class="k">浮动盈亏</span><span class="${pnlCls(pnlNum)}">${p.pnl} USD</span></div>
            ${liqDist !== null ? `<div class="grow"><span class="k">距强平</span><span>${liqDist.toFixed(0)}%</span></div>` : ""}
          </div>`;
        }).join("")}
        ${pos.length === 0 ? `<div class="muted">当前无持仓（各网格库存已全部换手）</div>` : ""}
      </div>
    </div>
    <div class="section"><h2>权益曲线（巡检轮次）</h2>${svg || `<div class="muted">样本积累中</div>`}</div>
    <div class="section"><h2>状态</h2>${chips.join(" ") || '<span class="chip">正常</span>'}
      ${(s.pending || []).length ? `<div class="muted" style="margin-top:8px">待清理：${s.pending.join(", ")}</div>` : ""}
      ${(s.orphans || []).length ? `<div class="muted" style="margin-top:8px">孤儿持仓：${s.orphans.join(", ")}</div>` : ""}
      ${s.lastActionNote ? `<div class="muted" style="margin-top:8px">${s.lastActionNote}</div>` : ""}
    </div>`;
}
async function load() {
  try {
    const r = await fetch(`/api/snapshot?t=${Date.now()}`);
    if (!r.ok) throw new Error(r.status === 429 ? "Cloudflare 每日请求额度已耗尽（1027）" : "HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    if (window.__SNAPSHOT_FALLBACK__) render({ ...window.__SNAPSHOT_FALLBACK__, quotaExceeded: true, dataValid: false, lastRoundStatus: "snapshot_unavailable" });
    else document.getElementById("content").textContent = "加载失败：" + e.message;
  }
}
function markLiked() {
  const btn = document.getElementById("likeBtn");
  btn.disabled = true;
  btn.firstChild.textContent = "已点赞 ";
}
async function loadLikes() {
  try {
    const j = await (await fetch(`/api/likes`)).json();
    document.getElementById("likeCount").textContent = j.likes;
    if (j.alreadyLiked) markLiked(); // 服务端判定：该访客今天已点过 → 置灰不给点
  } catch {}
}
document.getElementById("likeBtn").addEventListener("click", async () => {
  const btn = document.getElementById("likeBtn");
  if (btn.disabled) return;
  try {
    const response = await fetch(`/api/like`, { method: "POST" });
    if (!response.ok) throw new Error("点赞失败");
    const j = await response.json();
    document.getElementById("likeCount").textContent = j.likes;
    markLiked();
  } catch {}
});
load();
loadLikes();
setInterval(() => { if (!document.hidden) load(); }, 15 * 60000);
// iOS/浏览器用页面缓存恢复时（主屏幕打开、切标签页回来），定时器不会触发——强制拉取
window.addEventListener("pageshow", (e) => { if (e.persisted) { load(); loadLikes(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); loadLikes(); } });
</script>
</body>
</html>
